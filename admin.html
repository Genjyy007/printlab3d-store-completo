<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintLab 3D — Admin</title><link rel="stylesheet" href="css/styles.css"><style>
.admin{padding:42px 7vw 80px}.admin-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}.admin-head h1{font:700 48px/1 'Space Grotesk',sans-serif;margin:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.kpi{padding:20px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025)}.kpi small{color:#748097}.kpi strong{display:block;font:700 30px 'Space Grotesk';margin-top:8px}.admin-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:22px}.panel{padding:22px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025)}.panel h3{margin:0 0 18px;font-family:'Space Grotesk'}.bar{display:grid;grid-template-columns:130px 1fr 80px;gap:10px;align-items:center;font-size:12px;margin:14px 0}.bar-track{height:9px;border-radius:99px;background:#171c2b;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#22d3ee);border-radius:99px}.status{padding:5px 8px;border-radius:8px;background:rgba(53,208,127,.1);color:#62e29a;font-size:10px}.orders-table{width:100%;border-collapse:collapse;font-size:12px}.orders-table th,.orders-table td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.orders-table th{color:#6f7a90}.admin-tools{display:flex;gap:10px;flex-wrap:wrap}.admin-tools .btn{font-size:12px}@media(max-width:850px){.kpis{grid-template-columns:1fr 1fr}.admin-grid{grid-template-columns:1fr}}@media(max-width:500px){.admin{padding:30px 18px}.admin-head{display:block}.admin-head h1{font-size:38px;margin-bottom:16px}.kpis{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 65px}}
</style></head><body><div class="announcement">PAINEL ADMINISTRATIVO • MODO DEMONSTRAÇÃO</div><main class="admin"><div class="admin-head"><div><p class="eyebrow">PRINTLAB 3D</p><h1>Central de operação</h1><p style="color:#8390a6">Dashboard local com os pedidos salvos no navegador.</p></div><div class="admin-tools"><a class="btn btn-ghost" href="index.html">← Voltar para loja</a><button class="btn btn-primary" id="exportBtn">Exportar pedidos</button></div></div><section class="kpis"><div class="kpi"><small>Vendas registradas</small><strong id="kpiSales">R$ 0</strong></div><div class="kpi"><small>Pedidos</small><strong id="kpiOrders">0</strong></div><div class="kpi"><small>Ticket médio</small><strong id="kpiTicket">R$ 0</strong></div><div class="kpi"><small>Pontos concedidos</small><strong id="kpiPoints">0</strong></div></section><div class="admin-grid"><section class="panel"><h3>Vendas por produto</h3><div id="bars"></div></section><section class="panel"><h3>Fila de produção</h3><div id="production"></div></section></div><section class="panel" style="margin-top:18px"><h3>Pedidos recentes</h3><div style="overflow:auto"><table class="orders-table"><thead><tr><th>ID</th><th>Data</th><th>Método</th><th>Status</th><th>Total</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section></main><script src="js/products.js"></script><script>
const orders=JSON.parse(localStorage.getItem('printlab_orders')||'[]');const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);const total=orders.reduce((s,o)=>s+o.total,0);document.querySelector('#kpiSales').textContent=money(total);document.querySelector('#kpiOrders').textContent=orders.length;document.querySelector('#kpiTicket').textContent=money(orders.length?total/orders.length:0);document.querySelector('#kpiPoints').textContent=Math.floor(total);const bars=document.querySelector('#bars');const max=PRODUCTS.reduce((m,p)=>Math.max(m,p.sold),0);bars.innerHTML=PRODUCTS.slice(0,7).map(p=>`<div class="bar"><span>${p.name}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(p.sold/max*100)}%"></div></div><strong>${p.sold}</strong></div>`).join('');document.querySelector('#production').innerHTML=['Pagamento aprovado','Em produção','Acabamento','Controle de qualidade','Embalagem','Expedição'].map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px"><span>${x}</span><span class="status">${i<2?Math.max(0,orders.length-i):0} pedido(s)</span></div>`).join('');document.querySelector('#ordersBody').innerHTML=orders.length?orders.slice().reverse().map(o=>`<tr><td>#${o.id}</td><td>${o.date}</td><td>${o.method}</td><td>${o.status}</td><td>${money(o.total)}</td></tr>`).join(''):'<tr><td colspan="5">Nenhum pedido.</td></tr>';document.querySelector('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(orders,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='printlab-pedidos.json';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
